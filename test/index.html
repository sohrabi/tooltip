<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@sohrabi/tooltip demo</title>
    <link rel="stylesheet" href="test.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">@sohrabi/tooltip</p>
      <h1>Tiny tooltips for any website</h1>
      <p class="intro">Hover over or focus each button to test automatic positioning.</p>

      <section class="demo" aria-label="Tooltip position examples">
        <button data-tooltip="Displayed above the target" data-positions="top">Top</button>
        <button data-tooltip="Displayed on the right" data-positions="right">Right</button>
        <button data-tooltip="Displayed below the target" data-positions="bottom">Bottom</button>
        <button data-tooltip="Displayed on the left" data-positions="left">Left</button>
        <button
          data-tooltip="The invalid position is ignored safely"
          data-positions="unknown, top, bottom"
        >
          Automatic fallback
        </button>
      </section>

      <p class="hint">Press <kbd>Escape</kbd> to close an open tooltip.</p>
    </main>

    <script src="../dist/tooltip.min.js"></script>
    <script>
      initTooltip({
        backgroundColor: '#111827',
        borderRadius: '6px',
        maxWidth: '240px',
        offset: 8
      });
    </script>
  </body>
</html>
